# RillSwap regtest development stack. Use dev/devctl rather than calling
# docker compose directly; see DEVELOPMENT.md. Everything here is disposable
# regtest data with fixed, public credentials. Never point it at real funds.
name: rillswap-dev

# Shared settings for every service that runs the dev image. The image itself
# is built once, by the `chain` service below; keeping `build:` out of this
# anchor stops Compose from building and exporting a copy per service.
x-rill: &rill
  image: rillswap-dev:local
  volumes:
    - ..:/src:ro
    - state:/state
  restart: unless-stopped

# monero-wallet-rpc: one open wallet per process, so merchant and buyer each
# get their own. RPC stays inside the stack (no login, never published).
x-monero-wallet: &monero-wallet
  image: rillswap-dev-monero:local
  restart: unless-stopped
  depends_on:
    monerod:
      condition: service_healthy
  healthcheck:
    test: [CMD, curl, -fsS, -d, '{"jsonrpc":"2.0","id":0,"method":"get_version"}', http://127.0.0.1:18082/json_rpc]
    interval: 2s
    retries: 30
  command:
    - monero-wallet-rpc
    - --wallet-dir=/wallets
    - --rpc-bind-ip=0.0.0.0
    - --rpc-bind-port=18082
    - --confirm-external-bind
    - --disable-rpc-login
    - --rpc-ssl=disabled
    - --daemon-address=monerod:18081
    - --daemon-ssl=disabled
    - --trusted-daemon
    # Regtest starts at the newest hard fork (v16) from height 1, which the
    # wallet otherwise rejects as a mainnet daemon running old software.
    - --allow-mismatched-daemon-version
    - --non-interactive

x-lnd: &lnd
  image: lightninglabs/lnd@sha256:60fca3f409cf3d500db1d15c9965678a4b5a60758ff30863d52b02529c18be8b
  restart: unless-stopped
  depends_on:
    bitcoind:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "lncli", "--network=regtest", "getinfo"]
    interval: 3s
    timeout: 10s
    retries: 40
  entrypoint:
    - lnd
    - --bitcoin.active
    - --bitcoin.regtest
    - --bitcoin.node=bitcoind
    - --bitcoind.rpchost=bitcoind:18443
    - --bitcoind.rpcuser=rill
    - --bitcoind.rpcpass=rill-dev-regtest
    - --bitcoind.rpcpolling
    - --bitcoind.blockpollinginterval=1s
    - --bitcoind.txpollinginterval=1s
    - --rpclisten=0.0.0.0:10009
    - --restlisten=0.0.0.0:8080
    - --listen=0.0.0.0:9735
    - --tlsextraip=127.0.0.1
    - --noseedbackup
    - --nobootstrap
    - --trickledelay=50
    - --maxpendingchannels=10

services:
  bitcoind:
    image: bitcoin/bitcoin@sha256:49b55ea5c949a9ceff50786ee678d53f2728a4daa40a8139e3ee20243d24f281
    restart: unless-stopped
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -listen=0
      - -dnsseed=0
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -fallbackfee=0.0002
      - -printtoconsole=1
      # rill / rill-dev-regtest (LND, devtool)
      - -rpcauth=rill:5c1d0f2b7a9e4c3d8b6a1f0e2d3c4b5a$$e3f520d46a50046466e4cba52393284d9e84c6d693c4a5e35c9a8447424dd3d2
      # __cookie__ / rill-dev-regtest-cookie: a static cookie for Rill clients
      - -rpcauth=__cookie__:9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d$$a7f9835b158cc878c3a5d0c408ee19f9b64d5c1f510e01eb8e4b7b963194ead9
      # Chain observations only; introducing this reader must not restrict existing clients.
      - -rpcauth=rill-chain:571483e8a4d64c1cab99d7893c619cc8$$152bd5aa8a0d5d6e54f8a3673c4f324c5e77127374637cd7953f52ee086983f0
      - -rpcwhitelist=rill-chain:getblockchaininfo,getblockhash,getrawtransaction,getblockheader,gettxout,getdescriptoractivity
      # Explicit raw transaction submission only (separate from the chain reader).
      - -rpcauth=rill-broadcast:2ba7d1442d394611b099cf48b7a1b49a$$0172702bca62fcaa33926db5210c059ae94335d7e6194c739a893b121df1d5e4
      - -rpcwhitelist=rill-broadcast:testmempoolaccept,sendrawtransaction
      - -rpcwhitelistdefault=0
    volumes:
      - bitcoind:/home/bitcoin/.bitcoin
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-rpcuser=rill", "-rpcpassword=rill-dev-regtest", "getblockchaininfo"]
      interval: 2s
      timeout: 5s
      retries: 30

  lnd-maker:
    <<: *lnd
    command: [--alias=maker, --tlsextradomain=lnd-maker]
    volumes:
      - lnd-maker:/root/.lnd

  lnd-user:
    <<: *lnd
    command: [--alias=user, --tlsextradomain=lnd-user]
    volumes:
      - lnd-user:/root/.lnd

  lnd-merchant:
    <<: *lnd
    command: [--alias=merchant, --tlsextradomain=lnd-merchant]
    volumes:
      - lnd-merchant:/root/.lnd

  # Local EVM chain for the fake stablecoins (fUSDC, fUSDT). Chain id 31337,
  # the standard Anvil test mnemonic, a block every 2 s, and state persisted
  # across restarts (block history survives; historical state does not).
  # A restored chain resumes from its last saved block time, so the clock is
  # moved to wall time at start: the shop's receipt rail compares the two.
  # Anvil keeps whole seconds, so `date +%s` alone can leave it up to a second
  # behind and a block mined right after a preparation would predate it; one
  # second ahead keeps block time at or after wall time.
  # SIGTERM is forwarded so Anvil saves its state on stop.
  anvil:
    image: ghcr.io/foundry-rs/foundry@sha256:f69e1b8d1dda17d89227a4d0513b1d86f93ece430dea8d87aaea643da3607d3e # v1.8.4
    user: root
    command:
      - |
        anvil --host 0.0.0.0 --chain-id 31337 --hardfork prague \
          --block-time ${RILL_DEV_ANVIL_BLOCK_SECONDS:-2} --accounts 10 --balance 10000 \
          --base-fee 0 --gas-price 0 --disable-min-priority-fee \
          --state /data/state.json --state-interval 10 &
        pid=$$!
        trap 'kill -TERM $$pid' TERM INT
        until cast block-number -r http://127.0.0.1:8545 >/dev/null 2>&1; do sleep 0.5; done
        cast rpc anvil_setTime "$$(( $$(date +%s) + 1 ))" -r http://127.0.0.1:8545 >/dev/null
        wait $$pid
        wait $$pid
    volumes:
      - anvil:/data
    ports:
      - 127.0.0.1:${RILL_DEV_ANVIL_PORT:-8545}:8545
    healthcheck:
      test: [CMD, cast, block-number, -r, http://127.0.0.1:8545]
      interval: 2s
      retries: 30

  # Monero v0.18.5.3 private chain: regtest (mainnet address format), fixed
  # difficulty, no peers. --keep-fakechain keeps the chain across restarts
  # (without it monerod deletes it at start). The miner adds blocks.
  monerod:
    image: rillswap-dev-monero:local
    build: monero
    restart: unless-stopped
    command:
      - monerod
      - --regtest
      - --keep-fakechain
      - --fixed-difficulty=1
      - --offline
      - --no-igd
      - --non-interactive
      - --data-dir=/data
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=18081
      - --confirm-external-bind
      - --rpc-ssl=disabled
      - --disable-dns-checkpoints
      - --check-updates=disabled
    volumes:
      - monerod:/data
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:18081/get_height]
      interval: 2s
      retries: 30

  monero-wallet-merchant:
    <<: *monero-wallet
    volumes:
      - monero-merchant:/wallets

  monero-wallet-buyer:
    <<: *monero-wallet
    volumes:
      - monero-buyer:/wallets

  relay:
    image: scsibug/nostr-rs-relay@sha256:48d54c2d2781577cf3ed2951112f0953dc2c5e7c9d2ea20c64e8c0fa37d16e4d
    restart: unless-stopped
    volumes:
      - ./relay.toml:/usr/src/app/config.toml:ro
      - relay:/usr/src/app/db
    ports:
      - 127.0.0.1:${RILL_DEV_RELAY_PORT:-7777}:8080

  bootstrap:
    <<: *rill
    restart: "no"
    command: [python, /src/dev/devtool.py, bootstrap]
    environment:
      RILL_DEV_RELAY_HOST: ws://127.0.0.1:${RILL_DEV_RELAY_PORT:-7777}
    volumes:
      - ..:/src:ro
      - state:/state
      - lnd-maker:/lnd/maker:ro
      - browser-node:/browser-node
      - lnd-user:/lnd/user:ro
      - lnd-merchant:/lnd/merchant:ro
      - monero-merchant:/monero-wallets/merchant:ro
      - monero-buyer:/monero-wallets/buyer:ro
    depends_on:
      lnd-maker:
        condition: service_healthy
      lnd-user:
        condition: service_healthy
      lnd-merchant:
        condition: service_healthy
      monero-wallet-merchant:
        condition: service_healthy
      monero-wallet-buyer:
        condition: service_healthy
      anvil:
        condition: service_healthy
      relay:
        condition: service_started

  miner:
    <<: *rill
    command: [python, /src/dev/devtool.py, mine-loop]
    environment:
      RILL_DEV_BLOCK_SECONDS: ${RILL_DEV_BLOCK_SECONDS:-10}
      RILL_DEV_MONERO_BLOCK_SECONDS: ${RILL_DEV_MONERO_BLOCK_SECONDS:-2}
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  maker-btc-to-ln:
    <<: *rill
    command: [rill-provider, serve, --config, /state/makers/btc-to-ln/provider.json]
    environment:
      RILL_FORWARD: 18443=bitcoind:18443 10009=lnd-maker:10009
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  maker-ln-to-btc:
    <<: *rill
    command: [rill-provider, serve, --config, /state/makers/ln-to-btc/provider.json]
    environment:
      RILL_FORWARD: 18443=bitcoind:18443 10009=lnd-maker:10009
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # RS-010 stablecoin makers on the Anvil chain (ERC20Swap v6 HTLC, fUSDC).
  # They reach Anvil directly over HTTP; Bitcoin Core and LND still provide the
  # Bitcoin tip and the Lightning leg.
  maker-erc20-to-ln:
    <<: *rill
    command: [rill-provider, serve, --config, /state/makers/erc20-to-ln/provider.json]
    environment:
      RILL_FORWARD: 18443=bitcoind:18443 10009=lnd-maker:10009
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  maker-ln-to-erc20:
    <<: *rill
    command: [rill-provider, serve, --config, /state/makers/ln-to-erc20/provider.json]
    environment:
      RILL_FORWARD: 18443=bitcoind:18443 10009=lnd-maker:10009
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Interactive user shell: `devctl swap`, `devctl rill ...`, etc. run here.
  tools:
    <<: *rill
    command: [sleep, infinity]
    environment:
      RILL_FORWARD: 18443=bitcoind:18443 10009=lnd-user:10009
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # rill-payments merchant API. The CLI binds 127.0.0.1:8787 only, so socat
  # exposes it to the stack as merchant:8788 (never published to the host).
  merchant:
    <<: *rill
    command: [sh, /src/dev/merchant.sh]
    environment:
      RILL_FORWARD: 8080=lnd-merchant:8080
      RILL_EXPOSE: 8788=127.0.0.1:8787
    volumes:
      - ../dev:/src/dev:ro
      - ../rill-payments/src:/src/rill-payments/src:ro
      - state:/state
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  # Demo storefront. Its backend owns the merchant admin token; the browser
  # only talks to the shop.
  shop:
    <<: *rill
    working_dir: /src/rill-payments/examples/demo-shop
    command: [bun, --watch, server.ts]
    environment:
      RILL_DEV_MERCHANT_API: http://merchant:8788
      RILL_DEV_ANVIL_RPC: http://anvil:8545
      RILL_DEV_MONERO_WALLET_RPC: http://monero-wallet-merchant:18082
      RILL_DEV_MONEROD_RPC: http://monerod:18081
      RILL_DEV_WEB_PORT: ${RILL_DEV_WEB_PORT:-5273}
    ports:
      - 127.0.0.1:${RILL_DEV_SHOP_PORT:-8090}:8090
    volumes:
      - ../rill-payments/src:/src/rill-payments/src:ro
      - ../rill-payments/examples:/src/rill-payments/examples:ro
      - state:/state
    depends_on:
      merchant:
        condition: service_started
      anvil:
        condition: service_healthy

  # The one service that builds rillswap-dev:local. Every other service using
  # that image references it by name only, so it is built and loaded once.
  chain:
    image: rillswap-dev:local
    build:
      context: ..
      dockerfile: dev/Dockerfile
    restart: unless-stopped
    command: [python, /src/dev/chain_api.py]
    environment:
      RILL_DEV_CHAIN_PORT: ${RILL_DEV_CHAIN_PORT:-8091}
      RILL_DEV_WEB_PORT: ${RILL_DEV_WEB_PORT:-5273}
    volumes:
      - ./chain_api.py:/src/dev/chain_api.py:ro
    ports:
      - 127.0.0.1:${RILL_DEV_CHAIN_PORT:-8091}:8091
    depends_on:
      bitcoind:
        condition: service_healthy

  broadcast:
    image: rillswap-dev:local
    restart: unless-stopped
    command: [python, /src/dev/broadcast_api.py]
    environment:
      RILL_DEV_BROADCAST_PORT: ${RILL_DEV_BROADCAST_PORT:-8092}
      RILL_DEV_WEB_PORT: ${RILL_DEV_WEB_PORT:-5273}
    volumes:
      - ./broadcast_api.py:/src/dev/broadcast_api.py:ro
      - ./chain_api.py:/src/dev/chain_api.py:ro
    ports:
      - 127.0.0.1:${RILL_DEV_BROADCAST_PORT:-8092}:8092
    depends_on:
      bitcoind:
        condition: service_healthy

  # Dev-only gas sponsor for stablecoin claims without a wallet extension (see gas_sponsor.py).
  gas-sponsor:
    <<: *rill
    command: [python, /src/dev/gas_sponsor.py]
    environment:
      RILL_DEV_ANVIL_RPC: http://anvil:8545
      RILL_DEV_WEB_PORT: ${RILL_DEV_WEB_PORT:-5273}
    ports:
      - 127.0.0.1:${RILL_DEV_SPONSOR_PORT:-8094}:8094
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  user-node:
    image: rillswap-dev:local
    restart: unless-stopped
    command: [python, /src/dev/user_node_api.py]
    environment:
      RILL_DEV_NODE_PORT: ${RILL_DEV_NODE_PORT:-8093}
      RILL_DEV_WEB_PORT: ${RILL_DEV_WEB_PORT:-5273}
    volumes:
      - ./user_node_api.py:/src/dev/user_node_api.py:ro
      - ./chain_api.py:/src/dev/chain_api.py:ro
      - browser-node:/browser-node:ro
    ports:
      - 127.0.0.1:${RILL_DEV_NODE_PORT:-8093}:8093
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  web:
    <<: *rill
    working_dir: /src/rill-web
    environment:
      VITE_RILLSWAP_NETWORK: regtest
      VITE_RILLSWAP_RELAY: ws://127.0.0.1:${RILL_DEV_RELAY_PORT:-7777}
      VITE_RILLSWAP_MEMPOOL_API: http://127.0.0.1:${RILL_DEV_CHAIN_PORT:-8091}/api
      VITE_RILLSWAP_BROADCAST_API: http://127.0.0.1:${RILL_DEV_BROADCAST_PORT:-8092}/api
      VITE_RILLSWAP_NODE_API: http://127.0.0.1:${RILL_DEV_NODE_PORT:-8093}
      VITE_RILLSWAP_EVM_RPC: http://127.0.0.1:${RILL_DEV_ANVIL_PORT:-8545}
      VITE_RILLSWAP_EVM_SPONSOR: http://127.0.0.1:${RILL_DEV_SPONSOR_PORT:-8094}
      VITE_RILLSWAP_EVM_ENTRY_POINT: "0x0000000071727de22e5e9d8baf0edac6f37da032"
      VITE_RILLSWAP_EVM_7702_DELEGATE: "0x77021100bd87b7008e5e1989d0eb38555d0d0000"
    # The swap page's CSP and dependencies need the production bundle, so
    # build once, rebuild on change, and serve dist/ (refresh after edits).
    command:
      - sh
      - -c
      - >-
        export VITE_RILLSWAP_EVM_ASSETS="$$(cat /state/evm/browser-assets.json)" &&
        bun x --bun vite build &&
        (bun x --bun vite build --watch >/tmp/watch.log 2>&1 &) &&
        exec bun x --bun vite preview --host 0.0.0.0 --port 5173 --strictPort
    volumes:
      - state:/state:ro
      - ../rill-web/src:/src/rill-web/src:ro
      - ../rill-web/index.html:/src/rill-web/index.html:ro
      - ../rill-web/swap.html:/src/rill-web/swap.html:ro
      - ../rill-web/public:/src/rill-web/public:ro
      - ../rill-web/vite.config.ts:/src/rill-web/vite.config.ts:ro
      - ../rill-web/tsconfig.json:/src/rill-web/tsconfig.json:ro
    ports:
      - 127.0.0.1:${RILL_DEV_WEB_PORT:-5273}:5173
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  browser-node:
  bitcoind:
  lnd-maker:
  lnd-user:
  lnd-merchant:
  anvil:
  monerod:
  monero-merchant:
  monero-buyer:
  relay:
  state: