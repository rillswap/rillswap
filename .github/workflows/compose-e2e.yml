name: Full-stack Compose acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        network-fees: ['0', '1']
    env:
      COMPOSE_PROJECT_NAME: rill-reverse-browser-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.network-fees }}
      COMPOSE_FILE: dev/compose.yaml:dev/compose.ci.yaml:dev/compose.relay-resilience.yaml
      RILLSWAP_RUN_COMPOSE_E2E: '1'
      RILLSWAP_RUN_RELAY_RESILIENCE: '1'
      RILL_DEV_NETWORK_FEES: ${{ matrix.network-fees }}
      RILL_DEV_WEB_PORT: '15273'
      RILL_DEV_SHOP_PORT: '18090'
      RILL_DEV_RELAY_PORT: '17777'
      RILL_DEV_RELAY_ALT_PORT: '17778'
      RILL_DEV_CHAIN_PORT: '18091'
      RILL_DEV_BROADCAST_PORT: '18092'
      RILL_DEV_NODE_PORT: '18093'
      RILL_DEV_SPONSOR_PORT: '18094'
      RILL_DEV_ANVIL_PORT: '18545'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'
      - name: Install frozen browser and payment dependencies
        run: |
          (cd rill-payments && bun install --frozen-lockfile --ignore-scripts)
          (cd rill-web && bun install --frozen-lockfile --ignore-scripts)
      - name: Install matching Chromium
        working-directory: rill-web
        run: bunx playwright install --with-deps chromium
      - name: Build and start every Compose service with fresh isolated volumes
        timeout-minutes: 20
        run: |
          docker compose build
          docker compose up -d --no-build
          dev/devctl info
      - name: Check dev adapters and Compose contracts without backend access
        run: |
          docker run --rm --network none --volume "$PWD:/src:ro" \
            --env PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 rillswap-dev:local \
            python -m pytest -q /src/dev/tests -p no:cacheprovider
      - name: Wait for all services, chains, payment rails and maker announcements
        working-directory: rill-web
        run: bunx playwright test --config playwright.regtest.config.ts stack.spec.ts
      - name: Exercise both CLI swaps and every shop payment rail
        if: matrix.network-fees == '0'
        timeout-minutes: 10
        run: dev/devctl smoke
      - name: Exercise real browser swaps, node dispatch, sponsored claims and storefront receipts
        working-directory: rill-web
        run: |
          if [ "$RILL_DEV_NETWORK_FEES" = 1 ]; then
            bunx playwright test --config playwright.regtest.config.ts bitcoin.spec.ts reverse.spec.ts dynamicFees.spec.ts
          else
            bunx playwright test --config playwright.regtest.config.ts --grep-invert 'whole Compose stack'
          fi
      - name: Save service status and logs, including bootstrap failures
        if: always()
        run: |
          mkdir -p tmp/compose-e2e
          docker compose ps --all > tmp/compose-e2e/status.txt
          docker compose logs --no-color --timestamps > tmp/compose-e2e/services.log 2>&1
      - name: Remove only this run's disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compose-e2e-${{ github.run_attempt }}-fees-${{ matrix.network-fees }}
          path: |
            tmp/compose-e2e/
            tmp/reverse-live/
            rill-web/tmp/regtest-results/
            rill-web/tmp/regtest-report.xml
          retention-days: 7
          if-no-files-found: warn
